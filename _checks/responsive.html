<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>responsive check</title>
<style>
  html,body{margin:0;padding:0;background:#222;font:12px/1.4 system-ui,sans-serif;color:#ddd}
  .row{display:flex;gap:8px;align-items:flex-start;padding:8px}
  .col{background:#333;border:1px solid #555;border-radius:6px;overflow:hidden}
  .lbl{padding:4px 8px;background:#444;font-weight:700}
  iframe{border:0;display:block;background:#000}
  .pc iframe{width:1280px;height:1400px}
  .mo iframe{width:390px;height:1400px}
</style>
</head>
<body>
<div class="row">
  <div class="col pc"><div class="lbl">PC 1280px</div>
    <iframe id="pc" src="https://raw.githack.com/ekgp0721-bot/kkulpicklog-dashboard/main/index.html" scrolling="no"></iframe>
  </div>
  <div class="col mo"><div class="lbl">Mobile 390px</div>
    <iframe id="mo" src="https://raw.githack.com/ekgp0721-bot/kkulpicklog-dashboard/main/index.html" scrolling="no"></iframe>
  </div>
</div>
</body>
</html>
