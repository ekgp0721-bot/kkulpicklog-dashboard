<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>responsive check</title>
<style>
  html,body{margin:0;padding:0;background:#1b1c20;font:12px/1.4 system-ui,sans-serif;color:#ddd}
  .row{display:flex;gap:8px;align-items:flex-start;padding:8px}
  .col{background:#2a2b30;border:1px solid #4a4b52;border-radius:6px;overflow:hidden}
  .lbl{padding:5px 10px;background:#3a3b42;font-weight:700;font-size:13px}
  iframe{border:0;display:block;background:#0E0F13}
  .pc iframe{width:1280px;height:2800px}
  .mo iframe{width:390px;height:4600px}
</style>
</head>
<body>
<div class="row">
  <div class="col pc"><div class="lbl">PC 1280px</div>
    <iframe id="pc" src="../index.html" scrolling="no"></iframe>
  </div>
  <div class="col mo"><div class="lbl">Mobile 390px</div>
    <iframe id="mo" src="../index.html" scrolling="no"></iframe>
  </div>
</div>
</body>
</html>
